# Services for Continuously Casting Dashboards

set_cast_delay:
  name: Set Cast Delay
  description: Change the cast delay (how often devices are checked) at runtime.
  fields:
    delay:
      name: Delay
      description: The delay in seconds between device checks (5-300).
      required: true
      example: 60
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: seconds

set_logging_level:
  name: Set Logging Level
  description: Change the logging level at runtime.
  fields:
    level:
      name: Level
      description: The logging level to set.
      required: true
      example: "debug"
      selector:
        select:
          options:
            - "debug"
            - "info"
            - "warning"
            - "error"
            - "critical"

set_start_time:
  name: Set Start Time
  description: Change the global start time for casting windows.
  fields:
    time:
      name: Time
      description: The start time in HH:MM format.
      required: true
      example: "07:00"
      selector:
        time:

set_end_time:
  name: Set End Time
  description: Change the global end time for casting windows.
  fields:
    time:
      name: Time
      description: The end time in HH:MM format.
      required: true
      example: "01:00"
      selector:
        time:

stop_casting:
  name: Stop Casting
  description: Stop casting on a specific device or all devices.
  fields:
    device_name:
      name: Device Name
      description: The name of the device to stop. Leave empty to stop all devices.
      required: false
      example: "Living Room Display"
      selector:
        text:

pause_casting:
  name: Pause Casting
  description: >-
    Suspend CCD dashboard casting for one device. Zero seconds means until
    Resume Casting or integration restart; other Cast apps are not interrupted.
  fields:
    device_name:
      name: Device Name
      description: Exact configured display name. Must resolve to one device.
      required: true
      selector:
        text:
    duration_seconds:
      name: Pause Duration
      description: Zero to pause indefinitely until manually resumed or HA restarts.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: seconds
          mode: box

resume_casting:
  name: Resume Casting
  description: Resume casting on a specific device or trigger a check on all devices.
  fields:
    device_name:
      name: Device Name
      description: The name of the device to resume. Leave empty to check all devices.
      required: false
      example: "Living Room Display"
      selector:
        text:

select_dashboard:
  name: Temporarily Select Dashboard
  description: >-
    Prefer a configured dashboard by its zero-based index for a limited time.
    The dashboard's time and entity controls must still be satisfied.
  fields:
    device_name:
      name: Device Name
      description: The exact configured Cast device name.
      required: true
      selector:
        text:
    dashboard_index:
      name: Dashboard Index
      description: Zero-based position of the dashboard on this device.
      required: true
      selector:
        number:
          min: 0
          max: 100
          mode: box
    duration_seconds:
      name: Override Duration
      description: How long to prefer the dashboard before normal rules resume.
      required: false
      default: 300
      selector:
        number:
          min: 5
          max: 3600
          unit_of_measurement: seconds

clear_dashboard_override:
  name: Clear Dashboard Override
  description: Return a device to its priority and rotation rules.
  fields:
    device_name:
      name: Device Name
      description: The exact configured Cast device name.
      required: true
      selector:
        text:

report_dashboard_ready:
  name: Report Dashboard Frontend Readiness
  description: >-
    Optional internal reporter service, called from the CCD Readiness Reporter
    Lovelace card. Does not force a recast.
  fields:
    device_name:
      name: Device Name
      required: true
      selector:
        text:
    dashboard_path:
      name: Dashboard Path
      description: Browser pathname (not credentials or full URL).
      required: true
      selector:
        text:
    ready:
      name: Required Custom Elements Registered
      required: true
      selector:
        boolean:
    missing_elements:
      name: Missing Element Tags
      required: false
      selector:
        object:

report_cast_frontend:
  name: Report Cast Frontend Diagnostics
  description: >-
    Internal authenticated telemetry from an opted-in CCD Cast receiver.
    Only aggregate error counters and document states are accepted;
    no URLs, JavaScript messages or authentication information are stored.
  fields:
    cast_target:
      name: Receiver Correlation Token
      required: true
      selector:
        text:
    dashboard_path:
      name: Dashboard Path
      required: true
      selector:
        text:
    phase:
      name: Frontend Observation Phase
      required: true
      selector:
        select:
          options:
            - boot
            - observing
            - reload_requested
            - after_reload
    document_state:
      name: Document State
      required: false
      selector:
        text:
    metrics:
      name: Redacted Counters
      required: true
      selector:
        object:
